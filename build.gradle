plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version '2.1.0'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.1.0'
	id 'org.springframework.boot' version '3.3.3'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.leesh.inflpick'
version = '2024.1.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21) // JVM 버전을 17로 변경
	}
}

kotlin {
	jvmToolchain {
		languageVersion.set(JavaLanguageVersion.of(21)) // Kotlin의 JVM 타겟 버전도 17로 변경
	}
}

jar {
	enabled = false
}

bootJar {
	archiveFileName = 'ApiServer.jar'
}

repositories {
	mavenCentral()
}

dependencies {

	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Spring Configuration Processor
	implementation 'org.springframework.boot:spring-boot-configuration-processor'

	// Lombok
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Spring DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// JUnit 5
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Jetbrains Annotations
	implementation 'org.jetbrains:annotations:23.0.0'

	// Spring Data MongoDB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// AWS SDK
	implementation 'software.amazon.awssdk:s3:2.28.4'
	implementation 'software.amazon.awssdk:sts:2.28.4'

	// Java Jasypt
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	// Spring Boot Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	testImplementation 'org.springframework.security:spring-security-test'

	// Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JSON 처리에 Jackson 을 사용

	// Kotlin
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

	// Kotest
	// Kotest BOM(Bill of Materials) 추가
	testImplementation(platform("io.kotest:kotest-bom:5.6.2"))

	// Kotest 코어 모듈
	testImplementation("io.kotest:kotest-runner-junit5")

	// Kotest의 Spring 지원 모듈
	testImplementation("io.kotest.extensions:kotest-extensions-spring:1.1.2")

	// (선택 사항) Kotest의 Assertions 모듈
	testImplementation("io.kotest:kotest-assertions-core")

}

tasks.named('test') {
	useJUnitPlatform()
}
