services:
  api-server:
    image: inflpick/api-server:latest
    restart: always
    container_name: api-server
    ports:
      - '8080:8080'
      - '5005:5005'
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
    depends_on:
      - mongo
  mongo:
    image: mongo
    restart: always
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: inflpick
      MONGO_INITDB_ROOT_PASSWORD: inflpick
      MONGO_INITDB_DATABASE: api-server
    volumes:
      - ./data/db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  mongo-express:
    image: mongo-express
    restart: always
    container_name: mongo-express
    ports:
      - '8081:8081'
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://inflpick:inflpick@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
networks:
  inflpick-network:
    driver: bridge